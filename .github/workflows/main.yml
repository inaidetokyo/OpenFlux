name: Build OpenFlux PC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: p1neappleXpress/OpenFlux

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Client
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o openflux-client.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFlux-Windows-Client
          path: openflux-client.exe
